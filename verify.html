<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - The Commercial Bible</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase JS SDK (Browser Compatible CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700 text-center">
        <h1 class="text-2xl font-bold mb-2 text-amber-400">The Commercial Bible</h1>
        <p class="text-sm text-slate-400 mb-6">Official Certificate Verification System</p>

        <!-- Search Box -->
        <div id="search-box" class="mb-6 flex gap-2">
            <input type="text" id="manual-cert-id" placeholder="Enter Certificate ID (e.g. TCB-1001)" 
                   class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm">
            <button id="search-btn" onclick="handleManualSearch()"
                    class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg text-sm transition">
                Verify
            </button>
        </div>

        <div id="loading" class="text-slate-300 py-6 hidden">Verifying certificate, please wait...</div>

        <!-- Result Section -->
        <div id="result-container" class="hidden text-left space-y-4">
            <div class="bg-emerald-900/40 border border-emerald-500 text-emerald-300 p-3 rounded-lg text-center font-medium flex items-center justify-center gap-2">
                <span>✅</span> Valid & Authentic Certificate
            </div>
            <div class="border-t border-slate-700 pt-4 space-y-2 text-sm">
                <p><span class="text-slate-400">Certificate ID:</span> <span id="cert-id" class="font-mono text-amber-300"></span></p>
                <p><span class="text-slate-400">Recipient Name:</span> <span id="cert-name" class="font-bold text-lg text-white"></span></p>
                <p><span class="text-slate-400">Course Title:</span> <span id="cert-course" class="font-semibold text-blue-300"></span></p>
                <p><span class="text-slate-400">Issue Date:</span> <span id="cert-date" class="text-slate-200"></span></p>
            </div>
        </div>

        <!-- Error Section -->
        <div id="error-container" class="hidden bg-rose-900/40 border border-rose-500 text-rose-300 p-4 rounded-lg text-sm mt-4">
            ❌ Invalid Certificate ID or Not Found in Database.
        </div>
    </div>

    <script>
        // আপনার দেওয়ারিয়া অরিজিনাল ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyATmCaFIbsPv8K0GayA594WbVOl3-Tcsoo",
            authDomain: "commercial-bible-learning.firebaseapp.com",
            projectId: "commercial-bible-learning",
            storageBucket: "commercial-bible-learning.firebasestorage.app",
            messagingSenderId: "781358064342",
            appId: "1:781358064342:web:f4b2176f00856db867df77",
            measurementId: "G-Y1WGQ9PMJZ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        firebase.analytics();
        const db = firebase.firestore();

        async function verifyCertificate(targetId) {
            if (!targetId) return;

            const loadingEl = document.getElementById('loading');
            const resultEl = document.getElementById('result-container');
            const errorEl = document.getElementById('error-container');

            loadingEl.classList.remove('hidden');
            resultEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            try {
                // Firestore-এর 'certificates' কালেকশন থেকে অনুসন্ধান
                const docRef = await db.collection("certificates").doc(targetId.trim()).get();

                loadingEl.classList.add('hidden');

                if (docRef.exists) {
                    const data = docRef.data();
                    document.getElementById('cert-id').innerText = targetId.trim();
                    document.getElementById('cert-name').innerText = data.userName || "N/A";
                    document.getElementById('cert-course').innerText = data.courseTitle || "N/A";
                    document.getElementById('cert-date').innerText = data.issueDate || "N/A";

                    resultEl.classList.remove('hidden');
                } else {
                    errorEl.classList.remove('hidden');
                    errorEl.innerText = `❌ No certificate found for ID: ${targetId}`;
                }
            } catch (error) {
                console.error("Verification Error:", error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorEl.innerText = "⚠️ Connection error! Please check your internet or Firebase Rules.";
            }
        }

        function handleManualSearch() {
            const inputVal = document.getElementById('manual-cert-id').value;
            if (inputVal) {
                verifyCertificate(inputVal);
            }
        }

        // URL Parameter চেক করা (যেমন: ?id=TCB-1001)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const certId = urlParams.get('id');
            if (certId) {
                document.getElementById('manual-cert-id').value = certId;
                verifyCertificate(certId);
            }
        });
    </script>
</body>
</html>
